name: Build Krawings Department Device APK

# Cloud-builds the "Krawings Department Device" Android app (a Capacitor wrapper of
# https://portal.krawings.de — the shared kitchen tablet). OPEN variant: a normal app
# staff can leave (no kiosk lock-task). The finished .apk is published to a rolling
# GitHub release so any tablet can install it directly. No local Android Studio needed.
#
# One-app-per-folder: everything for this app lives under apps/department-device/ and the
# build runs THERE (Capacitor's CWD), so it generates its own throwaway android/ and never
# collides with the committed Portal app at apps/portal/. See apps/department-device/README.md.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/department-device/**'
      - '.github/workflows/build-station.yml'
      # This build compiles the Portal app's printer plugin into this app, so a
      # change to that file has to rebuild this APK too.
      - 'apps/portal/android/Krawings Portal/src/main/java/de/krawings/portal/plugins/ZebraPrintPlugin.java'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [ main ]
    paths:
      - 'apps/department-device/**'
      - '.github/workflows/build-station.yml'
      # This build compiles the Portal app's printer plugin into this app, so a
      # change to that file has to rebuild this APK too.
      - 'apps/portal/android/Krawings Portal/src/main/java/de/krawings/portal/plugins/ZebraPrintPlugin.java'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/department-device
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # Capacitor 8 CLI requires Node >= 22
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages (Capacitor 8 targets SDK 36)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JS dependencies (root node_modules)
        working-directory: .
        run: npm ci

      - name: Provide a webDir (the app loads the live site via server.url)
        run: |
          mkdir -p www
          printf '' > www/index.html

      - name: Generate the native Android project
        run: |
          rm -rf android          # defensive: android/ is generated + gitignored, never committed
          npx cap add android

      # NOTE: no kiosk lock-task step — this is the OPEN variant. (The Time Clock app wires
      # in native lock-task code; the Krawings Department Device intentionally does not.)

      - name: Sync Capacitor into the native project
        run: npx cap sync android

      # ── Native printing ──────────────────────────────────────────────────
      # Staff print food-container and shelf labels from THIS app, and a label
      # printer speaks classic Bluetooth (serial port profile). An Android
      # WebView has no Web Bluetooth API, so without native code the Label
      # Print screen can never connect — its Connect button is disabled.
      #
      # Runs AFTER `cap add android` + `cap sync` (both rewrite the generated
      # project) and BEFORE gradle, which is the only window where an overlay
      # survives. The plugin's Java is taken from the Portal app rather than
      # copied into this folder, so there is ONE implementation of printing.
      - name: Give the app the native Bluetooth printer plugin
        working-directory: .
        run: |
          set -euo pipefail
          SRC="apps/portal/android/Krawings Portal/src/main/java/de/krawings/portal/plugins/ZebraPrintPlugin.java"
          test -f "$SRC" || { echo "::error::The Portal app's ZebraPrintPlugin.java is missing ($SRC). The station app builds its printer support FROM that file — if it moved, update this step."; exit 1; }

          # Everything hangs off the appId. Hard-coding the package meant a
          # rename in capacitor.config.json would build green and print nothing:
          # the generated MainActivity would win and the plugin never register.
          APP_ID=$(node -p "require('./apps/department-device/capacitor.config.json').appId")
          NS=$(grep -o 'namespace = "[^"]*"' apps/department-device/android/app/build.gradle | cut -d'"' -f2)
          test "$NS" = "$APP_ID" || { echo "::error::The generated project's namespace ($NS) is not the appId ($APP_ID) — the injected classes would land in the wrong package."; exit 1; }
          grep -q "^package ${APP_ID};" apps/department-device/native/java/MainActivity.java \
            || { echo "::error::native/java/MainActivity.java declares a different package than ${APP_ID} — update it alongside capacitor.config.json."; exit 1; }

          DEST_DIR="apps/department-device/android/app/src/main/java/${APP_ID//.//}"
          mkdir -p "$DEST_DIR/plugins"

          # Same code, this app's package.
          sed "s/^package de\.krawings\.portal\.plugins;/package ${APP_ID}.plugins;/" \
            "$SRC" > "$DEST_DIR/plugins/ZebraPrintPlugin.java"
          grep -q "^package ${APP_ID}\.plugins;" "$DEST_DIR/plugins/ZebraPrintPlugin.java" \
            || { echo "::error::Package rewrite did not take — the plugin would not compile into this app."; exit 1; }
          ! grep -q 'de\.krawings\.portal' "$DEST_DIR/plugins/ZebraPrintPlugin.java" \
            || { echo "::error::A de.krawings.portal reference survived the rewrite — it cannot compile here."; exit 1; }

          # Replace the generated MainActivity with ours (it registers the plugin).
          cp apps/department-device/native/java/MainActivity.java "$DEST_DIR/MainActivity.java"
          grep -q 'registerPlugin(ZebraPrintPlugin.class)' "$DEST_DIR/MainActivity.java" \
            || { echo "::error::MainActivity does not register the plugin."; exit 1; }

          echo "Injected:"; find "$DEST_DIR" -name '*.java' -print

      # Capacitor's generated manifest has no Bluetooth permissions. Declaring
      # them is not optional: the runtime request the plugin makes fails
      # silently against an undeclared permission, which looks exactly like a
      # printer that will not connect.
      # Capacitor's generated manifest declares only INTERNET. Declaring the
      # rest is not cosmetic: a runtime permission request against an
      # undeclared permission is denied instantly with no dialog, which on a
      # tablet looks exactly like a printer that will not connect.
      - name: Declare the Bluetooth permissions in the manifest
        working-directory: .
        run: |
          set -euo pipefail
          MANIFEST="apps/department-device/android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST" || { echo "::error::No generated manifest at $MANIFEST"; exit 1; }

          python3 - "$MANIFEST" <<'PY'
          import sys, re
          path = sys.argv[1]
          xml = open(path, encoding='utf-8').read()

          # Scoped deliberately. The plugin only ever reads the list of ALREADY
          # PAIRED devices and cancels discovery — it never scans for new ones
          # and never wants a location. So SCAN is flagged neverForLocation, and
          # the three legacy permissions stop at Android 11, which is the last
          # version that used them. Without that, staff would be asked for
          # location just to print a label.
          perms = [
              ('android.permission.BLUETOOTH', ' android:maxSdkVersion="30"'),
              ('android.permission.BLUETOOTH_ADMIN', ' android:maxSdkVersion="30"'),
              ('android.permission.ACCESS_FINE_LOCATION', ' android:maxSdkVersion="30"'),
              ('android.permission.BLUETOOTH_CONNECT', ''),
              ('android.permission.BLUETOOTH_SCAN', ' android:usesPermissionFlags="neverForLocation"'),
          ]
          declared = lambda doc, name: re.search(
              r'<uses-permission[^>]*android:name="%s"' % re.escape(name), doc) is not None

          missing = [(n, a) for n, a in perms if not declared(xml, n)]
          if missing:
              block = '\n'.join(
                  '    <uses-permission android:name="%s"%s />' % (n, a) for n, a in missing)
              xml, n = re.subn(r'(\n\s*<application\b)', '\n' + block + r'\1', xml, count=1)
              if n != 1:
                  sys.exit('::error::No <application> element to insert before — manifest patch aborted')
              open(path, 'w', encoding='utf-8').write(xml)

          # Verified in the same process that wrote the file, matched exactly.
          # A shell `grep android.permission.BLUETOOTH` would have been happy
          # with the BLUETOOTH_CONNECT line and passed while BLUETOOTH itself
          # was missing.
          final = open(path, encoding='utf-8').read()
          absent = [n for n, _ in perms if not declared(final, n)]
          if absent:
              sys.exit('::error::Still missing after patching: ' + ', '.join(absent))
          print('OK: declared', ', '.join(n.rsplit('.', 1)[1] for n, _ in perms))
          PY

      - name: Generate the app icon (legacy + adaptive)
        run: |
          set -e
          if ! command -v convert >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; fi
          # Adaptive icons need a foreground + background. With only icon-only.png,
          # @capacitor/assets keeps Capacitor's DEFAULT foreground (a generic blue mark).
          # Derive both layers from the same art: the icon shrunk into the adaptive safe
          # zone as the foreground, solid white as the background.
          convert assets/icon-only.png -resize 66% -background none -gravity center -extent 1024x1024 assets/icon-foreground.png
          convert -size 1024x1024 xc:white assets/icon-background.png
          npx --yes @capacitor/assets generate --android

      - name: Build the debug APK
        working-directory: apps/department-device/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assert the APK is the station app (de.krawings.station)
        working-directory: .
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          set -euo pipefail
          APK=apps/department-device/android/app/build/outputs/apk/debug/app-debug.apk
          APP_ID=$(node -p "require('./apps/department-device/capacitor.config.json').appId")
          "$AAPT" dump badging "$APK" | grep -q "package: name='${APP_ID}'"
          # The printer is why staff can use this app for labels — prove the
          # FINISHED apk carries it, not just the source tree.
          "$AAPT" dump badging "$APK" | grep -q "uses-permission: name='android.permission.BLUETOOTH_CONNECT'"
          "$AAPT" dump badging "$APK" | grep -q "uses-permission: name='android.permission.BLUETOOTH_SCAN'"
          # Look through EVERY dex (this app spills over several, and ours is
          # the last one). `strings -a` because the default skips sections.
          CLASS="${APP_ID//.//}/plugins/ZebraPrintPlugin"
          FOUND=0
          for D in $(unzip -Z1 "$APK" 'classes*.dex'); do
            if unzip -p "$APK" "$D" | LC_ALL=C strings -a | grep -q "$CLASS"; then FOUND=1; break; fi
          done
          test "$FOUND" = 1 || { echo "::error::The built APK does not contain $CLASS — printing would be dead in this app."; exit 1; }
          echo "OK: ${APP_ID} with the Bluetooth printer plugin and its permissions"

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: krawings-station-apk
          path: apps/department-device/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to the 'station-latest' release
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/department-device/android/app/build/outputs/apk/debug/app-debug.apk krawings-station.apk
          gh release delete station-latest --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create station-latest krawings-station.apk \
            --repo "${{ github.repository }}" \
            --title "Krawings Department Device (latest build)" \
            --notes "Auto-built from ${{ github.sha }}. On the tablet: open this page, tap krawings-station.apk, and allow install from unknown sources. Currently points at STAGING (portal.krawings.de)."
