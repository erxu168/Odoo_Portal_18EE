name: Build Portal APK

# Cloud-builds the main "Krawings Portal" Android app and publishes the .apk to a
# rolling GitHub release, so a phone or tablet can install it straight from a link
# and nobody needs Android Studio.
#
# UNLIKE the station/timeclock/cooktimer apps, this one does NOT run `npx cap add
# android` to generate the project. It has CUSTOM native code — the Zebra Bluetooth
# printing plugin + barcode scanner bridge at
# apps/portal/android/Krawings Portal/src/main/java/de/krawings/portal/ — so the native
# project is COMMITTED (in apps/portal/android/) and built as it stands. Regenerating it
# would throw those away.
#
# One-app-per-folder: everything for this app lives under apps/portal/ and the build runs
# there (Capacitor's CWD), so it never collides with the other apps' throwaway android/.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/portal/**'
      - '.github/workflows/android-apk.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [ main ]
    paths:
      - 'apps/portal/**'
      - '.github/workflows/android-apk.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/portal

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # Capacitor 8 CLI requires Node >= 22
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # same major version Android Studio ships and builds with locally

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages (Capacitor 8 targets SDK 36)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JS dependencies (root node_modules)
        working-directory: .
        run: npm ci

      - name: Provide a webDir (the app loads the live site via server.url)
        # capacitor.config.ts points server.url at https://portal.krawings.de, so the
        # bundled assets are never shown — but `cap sync` still insists webDir exists.
        run: |
          mkdir -p www
          [ -f www/index.html ] || printf '' > www/index.html

      - name: Sync Capacitor into the committed native project
        # copy + update only: refreshes plugin wiring and regenerates capacitor.settings.gradle
        # with node_modules paths relative to apps/portal/. Never `cap add`, so the custom
        # Java (ZebraPrintPlugin, BarcodeScannerBridge) survives.
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: apps/portal/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify appId + custom plugins, then stage the APK
        working-directory: .
        run: |
          set -e
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          # The module folder has a space in its name ("Krawings Portal"), so glob for the APK.
          APK=$(find apps/portal/android -path '*outputs/apk/debug/*.apk' | head -1)
          test -n "$APK" || { echo "No APK produced"; exit 1; }
          "$AAPT" dump badging "$APK" | grep -q "package: name='de.krawings.portal'"
          test -f "apps/portal/android/Krawings Portal/src/main/java/de/krawings/portal/plugins/ZebraPrintPlugin.java"
          test -f "apps/portal/android/Krawings Portal/src/main/java/de/krawings/portal/BarcodeScannerBridge.java"
          grep -q 'registerPlugin(ZebraPrintPlugin.class)' "apps/portal/android/Krawings Portal/src/main/java/de/krawings/portal/MainActivity.java"
          echo "OK: de.krawings.portal with Zebra + barcode native code"
          cp "$APK" krawings-portal.apk
          ls -lh krawings-portal.apk

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: krawings-portal-apk
          path: krawings-portal.apk
          if-no-files-found: error

      - name: Publish APK to the 'portal-latest' release
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete portal-latest --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create portal-latest krawings-portal.apk \
            --repo "${{ github.repository }}" \
            --title "Krawings Portal (latest)" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Install on a phone or tablet by opening this release and tapping the .apk."
