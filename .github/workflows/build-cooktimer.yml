name: Build Cooking Timer APK

# Cloud-builds the "Cooking Timer" Android app (a Capacitor wrapper of
# https://portal.krawings.de/cooktimer — the KDS Cooking Timer station board). OPEN
# variant (no kiosk lock-task). The finished .apk is published to a rolling GitHub
# release so any tablet can install it directly. No local Android Studio needed.
#
# One-app-per-folder: everything lives under apps/cooktimer/ and the build runs there
# (Capacitor's CWD), so it generates its own throwaway android/ and never collides with
# the committed Portal app at apps/portal/. See apps/cooktimer/README.md.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/cooktimer/**'
      - '.github/workflows/build-cooktimer.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [ main ]
    paths:
      - 'apps/cooktimer/**'
      - '.github/workflows/build-cooktimer.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/cooktimer
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # Capacitor 8 CLI requires Node >= 22
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages (Capacitor 8 targets SDK 36)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JS dependencies (root node_modules)
        working-directory: .
        run: npm ci

      - name: Provide a webDir (the app loads the live site via server.url)
        run: |
          mkdir -p www
          printf '' > www/index.html

      - name: Generate the native Android project
        run: |
          rm -rf android          # defensive: android/ is generated + gitignored, never committed
          npx cap add android

      # NOTE: no kiosk lock-task step — this is the OPEN variant.

      - name: Sync Capacitor into the native project
        run: npx cap sync android

      - name: Generate the app icon (legacy + adaptive)
        run: |
          set -e
          if ! command -v convert >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; fi
          # Adaptive icons need a foreground + background; derive both from the same art
          # (icon shrunk into the safe zone; solid white background) so launchers don't
          # fall back to Capacitor's default blue mark.
          convert assets/icon-only.png -resize 66% -background none -gravity center -extent 1024x1024 assets/icon-foreground.png
          convert -size 1024x1024 xc:white assets/icon-background.png
          npx --yes @capacitor/assets generate --android

      - name: Build the debug APK
        working-directory: apps/cooktimer/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assert the APK is the cooktimer app (de.krawings.cooktimer)
        working-directory: .
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging apps/cooktimer/android/app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='de.krawings.cooktimer'"
          echo "OK: APK is de.krawings.cooktimer"

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: krawings-cooktimer-apk
          path: apps/cooktimer/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to the 'cooktimer-latest' release
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/cooktimer/android/app/build/outputs/apk/debug/app-debug.apk krawings-cooktimer.apk
          gh release delete cooktimer-latest --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create cooktimer-latest krawings-cooktimer.apk \
            --repo "${{ github.repository }}" \
            --title "Cooking Timer (latest build)" \
            --notes "Auto-built from ${{ github.sha }}. On the tablet: open this page, tap krawings-cooktimer.apk, and allow install from unknown sources. Currently points at STAGING (portal.krawings.de/cooktimer)."
